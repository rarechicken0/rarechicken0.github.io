  S.posts.forEach(function(p){if(c[p.type]!=null)c[p.type]++;if(S.saved.has(p.id))c.saved++});
  var defs=[["all","ទាំងអស់"],["addon","Addon"],["texture","Texture Pack"],["modpack","Java Modpack"],["saved","រក្សាទុក"]];
  $("#tabs").innerHTML=defs.map(function(d){return '<button type="button" class="tab" data-tab="'+d[0]+'" aria-pressed="'+(S.tab===d[0])+'">'+esc(d[1])+' <span class="n">'+kn(c[d[0]])+'</span></button>'}).join("");
}
function renderNote(){
  var m="";
  if(S.noDb)m="មិនទាន់កំណត់ Firebase ទេ។ សូមបំពេញឯកសារ config.js។";
  else if(S.uid&&S.canWrite===false)m="អ្នកអាចមើល និងទាញយកបាន ប៉ុន្តែការបញ្ចេញមតិ និងរក្សាទុកត្រូវការសិទ្ធិ Contributor។ សូមឲ្យ Owner ផ្តល់សិទ្ធិនេះ។";
  $("#note").innerHTML=m?'<div class="note">'+esc(m)+'</div>':"";
}
function phHtml(t){return '<div class="ph '+t.cls+'" aria-hidden="true">'+t.emo+'</div>'}
function cardHtml(p){
  var t=TYPES[p.type]||TYPES.addon,src=imgSrc(p.cover)||imgSrc((p.gallery||[])[0]),on=S.saved.has(p.id);
  return '<article class="card" tabindex="0" role="button" data-id="'+esc(p.id)+'" aria-label="'+esc(p.title)+'">'+
    '<div class="cover">'+(src?'<img loading="lazy" alt="" src="'+esc(src)+'">':phHtml(t))+
    '<button type="button" class="bm" data-save="'+esc(p.id)+'" aria-pressed="'+on+'" aria-label="រក្សាទុក">'+bm(on)+'</button></div>'+
    '<div class="cbody"><h3 class="ctitle">'+esc(p.title)+'</h3>'+
    '<div class="meta"><span class="badge">'+esc(t.label)+'</span>'+(p.ver?'<span>'+esc(p.ver)+'</span>':'')+'<span>'+esc(p.size||"-- MB")+'</span></div>'+
    (p.caption?'<p class="ccap">'+esc(p.caption)+'</p>':'')+'</div></article>';
}
function renderGrid(){
  var g=$("#grid");
  if(S.noDb){g.innerHTML='<div class="empty"><b>មិនអាចតភ្ជាប់បានទេ</b>មិនអាចតភ្ជាប់ Firebase បានទេ។ សូមពិនិត្យ config.js។</div>';return}
  if(S.err){g.innerHTML='<div class="empty"><b>មានបញ្ហា</b>មិនអាចផ្ទុកបញ្ជី Mod បានទេ។ សូមផ្ទុកទំព័រឡើងវិញ។</div>';return}
  if(!S.loaded){g.innerHTML='<div class="empty"><b>កំពុងផ្ទុក…</b>'+(S.slow?'ការតភ្ជាប់យឺតជាងធម្មតា សូមរង់ចាំបន្តិច។':'')+'</div>';return}
  var v=visible();
  if(!v.length){
    var h;
    if(!S.posts.length)h=S.isOwner?'<b>មិនទាន់មាន Mod ទេ</b>ចុច “បង្ហោះ Mod” ខាងលើ ដើម្បីបង្ហោះ Mod ដំបូងរបស់អ្នក។':'<b>មិនទាន់មាន Mod ទេ</b>Owner នឹងបង្ហោះ Mod នៅទីនេះឆាប់ៗ។';
    else if(S.tab==="saved"&&!S.q)h='<b>មិនទាន់មានអ្វីរក្សាទុកទេ</b>ចុចរូបចំណាំលើ Mod ណាមួយ ដើម្បីរក្សាទុកទីនេះ។';
    else h='<b>រកមិនឃើញ</b>សាកល្បងពាក្យផ្សេង ឬប្តូរប្រភេទ។';
    g.innerHTML='<div class="empty">'+h+'</div>';return}
  g.innerHTML=v.map(cardHtml).join("");
}
function renderAll(){renderAcct();renderTabs();renderNote();renderGrid();if(S.open)renderTop()}

/* ---------- saves ---------- */
function toggleSave(id){
  if(!S.db||!S.uid){toast("ត្រូវចូលគណនី Google ដើម្បីរក្សាទុក");return}
  if(S.canWrite===false){toast("អ្នកមិនទាន់មានសិទ្ធិរក្សាទុកទេ");return}
  var s=new Set(S.saved);if(s.has(id))s.delete(id);else s.add(id);S.saved=s;
  renderTabs();renderGrid();if(S.open)renderTop();
  var ids=Array.from(s);
  wq=wq.then(function(){return S.db.doc("saves/"+S.uid).set({ids:ids})}).catch(function(){toast("រក្សាទុកមិនបាន")});
}

/* ---------- detail ---------- */
function openPost(id){
  var p=S.posts.find(function(x){return x.id===id});if(!p)return;
  S.open=id;S.gi=0;S.picker=null;S.comments=[];S.cmLoaded=false;S.cImg=null;
  $("#dpanel").innerHTML='<div class="phead"><span class="pixl">RC-CRAFT</span><button type="button" class="btn" data-close aria-label="បិទ">'+ico("x",14)+'</button></div>'+
    '<div id="dTop"></div><section class="cmsec"><h3>មតិយោបល់ <span id="cmCount"></span></h3><div id="composer"></div><div id="cmList"></div></section>';
  $("#detail").hidden=false;$("#detail").scrollTop=0;lockScroll();
  renderTop();renderComposer();renderComments();startComments(id);
  if(location.hash!=="#mod-"+id)location.hash="mod-"+id;
}
function closeDetail(){
  if(S.unsubC){S.unsubC();S.unsubC=null}
  S.open=null;$("#detail").hidden=true;lockScroll();
  if(/^#mod-/.test(location.hash))location.hash="";
}
function renderTop(){
  var el=$("#dTop");if(!el)return;
  var p=S.posts.find(function(x){return x.id===S.open});
  if(!p){el.innerHTML='<div class="dbody"><p>Mod នេះត្រូវបានលុបហើយ។</p></div>';return}
  var t=TYPES[p.type]||TYPES.addon;
  var imgs=[p.cover].concat(Array.isArray(p.gallery)?p.gallery:[]).map(imgSrc).filter(Boolean);
  if(S.gi>=imgs.length)S.gi=0;
  var main=imgs.length?'<img src="'+esc(imgs[S.gi])+'" alt="">':phHtml(t);
  var thumbs=imgs.length>1?'<div class="thumbs">'+imgs.map(function(s,i){return '<button type="button" class="th" data-gi="'+i+'" aria-pressed="'+(i===S.gi)+'" aria-label="រូបភាពទី '+kn(i+1)+'"><img src="'+esc(s)+'" alt=""></button>'}).join("")+'</div>':"";
  var links=(Array.isArray(p.links)?p.links:[]).map(function(l){return {label:l&&l.label,url:safeUrl(l&&l.url)}}).filter(function(l){return l.url});
  var dls=links.length?'<div class="dls">'+links.map(function(l){return '<a class="btn primary" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+ico("download")+' '+esc(l.label||"ទាញយក")+'</a>'}).join("")+'</div>':'<p class="muted" style="margin:0">មិនទាន់មានតំណទាញយកទេ។</p>';
  var on=S.saved.has(p.id);
  el.innerHTML='<div class="gmain">'+main+'</div>'+thumbs+'<div class="dbody">'+
    '<div class="chips"><span class="pill">'+esc(t.label)+'</span>'+(p.ver?'<span>'+esc(p.ver)+'</span>':'')+(p.size?'<span>'+esc(p.size)+'</span>':'')+'<span>'+esc(ago(p.ts))+'</span></div>'+
    '<h2 class="dtitle">'+esc(p.title)+'</h2>'+(p.caption?'<p class="cap">'+esc(p.caption)+'</p>':'')+
    '<h3 class="sub">ទាញយក</h3>'+dls+
    '<div class="acts"><button type="button" class="btn" data-save2>'+bm(on)+' '+(on?"បានរក្សាទុក":"រក្សាទុក")+'</button>'+
    (S.isOwner?'<button type="button" class="btn" data-edit>'+ico("edit")+' កែសម្រួល</button><button type="button" class="btn" data-del>'+ico("trash")+' លុប</button>':'')+'</div></div>';
}

/* ---------- comments ---------- */
function startComments(id){
  if(!S.db)return;
  if(S.unsubC){S.unsubC();S.unsubC=null}
  S.unsubC=S.db.collection("comments").where("post","==",id).onSnapshot(function(snap){
    S.comments=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o}).sort(function(a,b){return (a.ts||0)-(b.ts||0)});
    S.cmLoaded=true;renderComments();ensureProfiles();
  },function(){S.cmLoaded=true;S.comments=[];renderComments();toast("ផ្ទុកមតិមិនបាន")});
}
async function ensureProfiles(){
  if(!S.user)return;
  var ids=S.comments.map(function(c){return c.uid}).concat([S.ownerId]).filter(function(i,k,a){return i&&a.indexOf(i)===k&&!(i in S.profiles)});
  if(!ids.length)return;
  try{var ps=await S.user.profiles(ids);Object.assign(S.profiles,ps);renderComments()}catch(e){}
}
function commentHtml(c){
  var pr=S.profiles[c.uid],name=(pr&&pr.name)||"អ្នកប្រើ",isO=!!c.uid&&c.uid===S.ownerId;
  var av=pr&&pr.avatarUrl?'<img class="av" alt="" src="'+esc(pr.avatarUrl)+'">':'<span class="av"></span>';
  var cnt={},mine=null;
  Object.keys(S.reactions).forEach(function(u){var e=S.reactions[u][c.id];if(e){cnt[e]=(cnt[e]||0)+1;if(u===S.uid)mine=e}});
  var chips=EMOJIS.filter(function(e){return cnt[e]}).map(function(e){return '<button type="button" class="rx" data-rx="'+esc(c.id)+'" data-e="'+e+'" aria-pressed="'+(mine===e)+'">'+e+' <span>'+kn(cnt[e])+'</span></button>'}).join("");
  var picker=S.picker===c.id?EMOJIS.map(function(e){return '<button type="button" class="rx" data-rx="'+esc(c.id)+'" data-e="'+e+'" aria-pressed="'+(mine===e)+'">'+e+'</button>'}).join(""):"";
  var canDel=S.isOwner||(S.uid&&c.uid===S.uid);
  var src=imgSrc(c.img?{d:c.img}:null);
  return '<div class="cm">'+av+'<div style="min-width:0"><div class="cmhead"><span class="cmname">'+esc(name)+'</span>'+(isO?'<b class="tag-owner">OWNER</b>':'')+'<span class="cmtime">'+esc(ago(c.ts))+'</span></div>'+
    (c.text?'<p class="cmtext">'+esc(c.text)+'</p>':'')+(src?'<img class="cmimg" loading="lazy" alt="" src="'+esc(src)+'">':'')+
    '<div class="rxrow">'+chips+(picker||'<button type="button" class="rx add" data-pick="'+esc(c.id)+'" aria-label="ប្រតិកម្ម">+ ប្រតិកម្ម</button>')+
    (canDel?'<button type="button" class="btn xs" data-cdel="'+esc(c.id)+'">'+ico("trash",14)+' លុប</button>':'')+'</div></div></div>';
}
function renderComments(){
  var el=$("#cmList");if(!el)return;
  var n=$("#cmCount");if(n)n.textContent=S.comments.length?kn(S.comments.length):"";
  if(!S.cmLoaded){el.innerHTML='<p class="muted">កំពុងផ្ទុក…</p>';return}
  if(!S.comments.length){el.innerHTML='<p class="muted">មិនទាន់មានមតិទេ។ សូមធ្វើជាអ្នកដំបូង។</p>';return}
  el.innerHTML=S.comments.map(commentHtml).join("");
}
function renderComposer(){
  var el=$("#composer");if(!el)return;
  if(!S.db||!S.uid){el.innerHTML='<p class="muted">ត្រូវចូលគណនី Google ដើម្បីបញ្ចេញមតិ។</p>';return}
  if(S.canWrite===false){el.innerHTML='<p class="muted">អ្នកមិនទាន់មានសិទ្ធិបញ្ចេញមតិទេ។ សូមឲ្យ Owner ផ្តល់សិទ្ធិ Contributor។</p>';return}
  el.innerHTML='<div class="comp"><textarea id="cText" rows="2" maxlength="1000" placeholder="សរសេរមតិរបស់អ្នក…" aria-label="មតិ"></textarea><div id="cPrev"></div>'+
    '<div class="comprow"><label class="btn" for="cFile">'+ico("img")+' រូបភាព</label><input id="cFile" type="file" accept="image/*" hidden><span class="grow"></span><button type="button" class="btn primary" id="cSend">'+ico("send")+' ផ្ញើ</button></div></div>';
  renderCPrev();
}
function renderCPrev(){var el=$("#cPrev");if(!el)return;el.innerHTML=S.cImg?'<div class="prev"><img alt="" src="'+esc(S.cImg)+'"><button type="button" class="btn xs" data-rmimg>'+ico("x",12)+' ដកចេញ</button></div>':""}
async function sendComment(){
  if(!canWriteNow()||!S.open)return;
  var ta=$("#cText"),text=ta.value.trim();
  if(!text&&!S.cImg){toast("សូមសរសេរអក្សរ ឬដាក់រូបភាព");return}
  var b=$("#cSend");b.disabled=true;
  try{
    var doc={post:S.open,uid:S.uid,text:text,ts:Date.now()};if(S.cImg)doc.img=S.cImg;
    await S.db.collection("comments").add(doc);
    ta.value="";S.cImg=null;renderCPrev();
  }catch(e){toast("ផ្ញើមិនបាន៖ "+((e&&e.message)||"")) }
  b.disabled=false;
}
function react(cid,e){
  if(!canWriteNow()){toast("ត្រូវមានសិទ្ធិ Contributor ដើម្បីដាក់ប្រតិកម្ម");return}
  var m=Object.assign({},S.reactions[S.uid]||{});
  if(m[cid]===e)delete m[cid];else m[cid]=e;
  S.reactions[S.uid]=m;S.picker=null;renderComments();
  wq=wq.then(function(){return S.db.doc("reactions/"+S.uid).set({m:m})}).catch(function(){toast("ដាក់ប្រតិកម្មមិនបាន")});
}
function arm(btn,run){
  if(btn.dataset.armed){run();return}
  btn.dataset.armed="1";var old=btn.innerHTML;btn.innerHTML="ចុចម្តងទៀតដើម្បីលុប";
  setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.innerHTML=old}},3500);
}
async function deleteComment(id){try{await S.db.doc("comments/"+id).delete()}catch(e){toast("លុបមតិមិនបាន")}}
async function deletePost(id){
  try{
    var snap=await S.db.collection("comments").where("post","==",id).get();
    for(var i=0;i<snap.docs.length;i++){await S.db.doc("comments/"+snap.docs[i].id).delete()}
    await S.db.doc("posts/"+id).delete();toast("បានលុប Mod");closeDetail();
  }catch(e){toast("លុបមិនបាន")}
}

/* ---------- editor (owner) ---------- */
function linkRow(l){return '<div class="lrow"><input class="l-label" maxlength="40" placeholder="ឈ្មោះប៊ូតុង (ឧ. Mediafire)" aria-label="ឈ្មោះប៊ូតុង" value="'+esc(l&&l.label)+'"><input class="l-url" type="url" inputmode="url" placeholder="https://…" aria-label="តំណ" value="'+esc(l&&l.url)+'"><button type="button" class="btn ghost" data-rmlink aria-label="លុបតំណ">'+ico("x",14)+'</button></div>'}
function openEditor(p){
  if(!S.isOwner)return;
  S.ed={id:p?p.id:null,ts:p?p.ts:null,cover:(p&&p.cover)||null,gallery:p&&Array.isArray(p.gallery)?p.gallery.slice():[],busy:0};
  var links=p&&Array.isArray(p.links)&&p.links.length?p.links:[{label:"",url:""}];
  $("#epanel").innerHTML='<div class="phead"><span class="pixl">'+(p?"កែសម្រួល Mod":"បង្ហោះ Mod ថ្មី")+'</span><button type="button" class="btn" data-close aria-label="បិទ">'+ico("x",14)+'</button></div>'+
  '<form id="eform" class="eform" novalidate>'+
  '<div class="field"><label for="eType">ប្រភេទ</label><select id="eType">'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(p&&p.type===k?' selected':'')+'>'+TYPES[k].label+'</option>'}).join("")+'</select></div>'+
  '<div class="field"><label for="eTitle">ឈ្មោះ</label><input id="eTitle" maxlength="120" value="'+esc(p?p.title:"")+'"></div>'+
  '<div class="field"><label for="eVer">ជំនាន់ Minecraft</label><input id="eVer" maxlength="60" placeholder="ឧ. Bedrock 1.21 ឬ Java 1.20.1" value="'+esc(p?p.ver:"")+'"></div>'+
  '<div class="field"><label for="eSize">ទំហំឯកសារ</label><input id="eSize" maxlength="20" placeholder="ឧ. 2.1 MB" value="'+esc(p?p.size:"")+'"></div>'+
  '<div class="field"><label for="eCap">ពណ៌នា (Caption)</label><textarea id="eCap" rows="6" maxlength="4000">'+esc(p?p.caption:"")+'</textarea></div>'+
  '<div class="field"><label>រូបភាពមុខ (Cover)</label><div id="eCover" class="edimgs"></div></div>'+
  '<div class="field"><label>រូបភាពបន្ថែម (រហូតដល់ ៤)</label><div id="eGal" class="edimgs"></div></div>'+
  '<div class="field"><label>តំណទាញយក (Mediafire, Google Drive, Mega, CurseForge…)</label><div id="eLinks">'+links.map(linkRow).join("")+'</div><div><button type="button" class="btn" data-addlink>'+ico("plus",14)+' បន្ថែមតំណ</button></div></div>'+
  '<div class="eacts"><button type="button" class="btn" data-close>បោះបង់</button><button type="submit" class="btn primary" id="eSave">'+(p?"រក្សាទុកការកែ":"បង្ហោះ")+'</button></div></form>';
  renderEdImgs();$("#editor").hidden=false;$("#editor").scrollTop=0;lockScroll();
}
function edThumb(i,key,idx){return '<div class="edimg"><img alt="" src="'+esc(imgSrc(i))+'"><button type="button" data-rmed="'+key+'" data-idx="'+idx+'" aria-label="ដកចេញ">×</button></div>'}
function renderEdImgs(){
  var e=S.ed;if(!e)return;
  var busy=e.busy?'<span class="muted">កំពុងរៀបចំរូប…</span>':'';
  $("#eCover").innerHTML=(e.cover&&imgSrc(e.cover)?edThumb(e.cover,"cover",0):'<label class="btn" for="eCoverFile">'+ico("img")+' ជ្រើសរូប</label><input id="eCoverFile" type="file" accept="image/*" hidden>')+busy;
  $("#eGal").innerHTML=e.gallery.map(function(g,i){return edThumb(g,"gal",i)}).join("")+(e.gallery.length<4?'<label class="btn" for="eGalFile">'+ico("plus",14)+' បន្ថែម</label><input id="eGalFile" type="file" accept="image/*" multiple hidden>':'')+busy;
}
async function handleEdFiles(files,kind){
  var e=S.ed;if(!e)return;
  var list=Array.prototype.slice.call(files);if(kind==="gal")list=list.slice(0,4-e.gallery.length);else list=list.slice(0,1);
  e.busy++;renderEdImgs();
  for(var i=0;i<list.length;i++){
    try{var r=await prepPostImage(list[i]);if(r){if(kind==="cover")e.cover=r;else if(e.gallery.length<4)e.gallery.push(r)}else toast("រូបភាពធំពេក")}catch(x){toast("មិនអាចអានរូបភាពបាន")}
  }
  e.busy--;if(S.ed===e)renderEdImgs();
}
async function submitEditor(ev){
  ev.preventDefault();var e=S.ed;if(!e||!S.isOwner)return;
  if(e.busy){toast("សូមរង់ចាំរូបភាពបញ្ចប់");return}
  var title=$("#eTitle").value.trim();if(!title){toast("សូមបំពេញឈ្មោះ");$("#eTitle").focus();return}
  var links=[],bad=false;
  Array.prototype.forEach.call(document.querySelectorAll("#eLinks .lrow"),function(r){
    var l=r.querySelector(".l-label").value.trim(),u=r.querySelector(".l-url").value.trim();
    if(!l&&!u)return;if(!safeUrl(u)){bad=true;return}links.push({label:l||"ទាញយក",url:u})});
  if(bad){toast("តំណត្រូវចាប់ផ្តើមដោយ https://");return}
  var doc={type:$("#eType").value,title:title,caption:$("#eCap").value.trim(),ver:$("#eVer").value.trim(),size:$("#eSize").value.trim(),cover:e.cover||null,gallery:e.gallery,links:links,by:S.uid,ts:e.ts||Date.now(),upd:Date.now()};
  var b=$("#eSave");b.disabled=true;
  try{
    var ref=e.id?S.db.doc("posts/"+e.id):S.db.collection("posts").doc();
    await ref.set(doc);toast(e.id?"បានរក្សាទុកការកែ":"បានបង្ហោះ Mod");closeEditor();
  }catch(x){toast("បង្ហោះមិនបាន៖ "+((x&&x.message)||""));b.disabled=false}
}
function closeEditor(){S.ed=null;$("#editor").hidden=true;lockScroll()}

/* ---------- events ---------- */
$("#tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;renderTabs();renderGrid()});
var qT;$("#q").addEventListener("input",function(e){clearTimeout(qT);var v=e.target.value;qT=setTimeout(function(){S.q=v;renderGrid()},140)});
$("#newBtn").addEventListener("click",function(){openEditor(null)});
$("#grid").addEventListener("click",function(e){
  var s=e.target.closest("[data-save]");if(s){e.stopPropagation();toggleSave(s.dataset.save);return}
  var c=e.target.closest(".card");if(c)openPost(c.dataset.id)});
$("#grid").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.classList.contains("card"))openPost(e.target.dataset.id)});
$("#detail").addEventListener("click",function(e){
  if(e.target===$("#detail")){closeDetail();return}
  var t=e.target,b;
  if(t.closest("[data-close]")){closeDetail();return}
  if((b=t.closest("[data-gi]"))){S.gi=+b.dataset.gi;renderTop();return}
  if(t.closest("[data-save2]")){toggleSave(S.open);return}
  if(t.closest("[data-edit]")){var p=S.posts.find(function(x){return x.id===S.open});if(p)openEditor(p);return}
  if((b=t.closest("[data-del]"))){arm(b,function(){deletePost(S.open)});return}
  if((b=t.closest("[data-cdel]"))){var id=b.dataset.cdel;arm(b,function(){deleteComment(id)});return}
  if((b=t.closest("[data-pick]"))){S.picker=S.picker===b.dataset.pick?null:b.dataset.pick;renderComments();return}
  if((b=t.closest("[data-rx]"))){react(b.dataset.rx,b.dataset.e);return}
  if(t.closest("[data-rmimg]")){S.cImg=null;renderCPrev();return}
  if(t.closest("#cSend")){sendComment();return}
});
$("#detail").addEventListener("change",async function(e){
  if(e.target.id!=="cFile"||!e.target.files[0])return;
  var f=e.target.files[0];e.target.value="";
  try{var d=await dataUnder(f,55000);if(d){S.cImg=d;renderCPrev()}else toast("រូបភាពធំពេក")}catch(x){toast("មិនអាចអានរូបភាពបាន")}
});
$("#editor").addEventListener("click",function(e){
  if(e.target===$("#editor")){closeEditor();return}
  var t=e.target,b;
  if(t.closest("[data-close]")){closeEditor();return}
  if(t.closest("[data-addlink]")){$("#eLinks").insertAdjacentHTML("beforeend",linkRow({label:"",url:""}));return}
  if((b=t.closest("[data-rmlink]"))){var rows=document.querySelectorAll("#eLinks .lrow");if(rows.length>1)b.closest(".lrow").remove();else{b.closest(".lrow").querySelectorAll("input").forEach(function(i){i.value=""})}return}
  if((b=t.closest("[data-rmed]"))){if(b.dataset.rmed==="cover")S.ed.cover=null;else S.ed.gallery.splice(+b.dataset.idx,1);renderEdImgs();return}
});
$("#editor").addEventListener("change",function(e){
  var t=e.target;if(!t.files||!t.files.length)return;
  if(t.id==="eCoverFile")handleEdFiles(t.files,"cover");else if(t.id==="eGalFile")handleEdFiles(t.files,"gal");
});
$("#editor").addEventListener("submit",submitEditor);
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(!$("#editor").hidden)closeEditor();else if(!$("#detail").hidden)closeDetail()});
function fromHash(){
  var m=/^#mod-([A-Za-z0-9_-]+)$/.exec(location.hash);
  if(m){if(S.open!==m[1]&&S.loaded)openPost(m[1])}else if(S.open){closeDetail()}
}
window.addEventListener("hashchange",fromHash);

/* ---------- boot ---------- */
async function init(){
  renderAll();
  var slowT=setTimeout(function(){if(!S.loaded){S.slow=true;renderGrid()}},10000);
  var fb=await window.RCFirebase.ready();
  S.db=fb.db;S.user=fb.user;S.assets=fb.assets;
  if(S.user){
    try{S.isOwner=await S.user.isOwner();S.me=await S.user.me();S.uid=S.me.id;S.canWrite=await S.user.can("data.write")}catch(e){}
  }
  if(!S.db){S.noDb=true;clearTimeout(slowT);renderAll();return}
  renderAll();
  S.db.collection("posts").onSnapshot(function(snap){
    S.posts=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o}).sort(function(a,b){return (b.ts||0)-(a.ts||0)});
    S.loaded=true;S.err=false;clearTimeout(slowT);renderAll();fromHash();
  },function(){S.err=true;clearTimeout(slowT);renderGrid()});
  S.db.doc("site/config").onSnapshot(function(s){
    S.ownerId=s.exists?(s.data().ownerId||null):null;
    if(S.isOwner&&S.uid&&S.ownerId!==S.uid&&!S.cfgWrote){S.cfgWrote=true;S.db.doc("site/config").set({ownerId:S.uid}).catch(function(){})}
    if(S.open){ensureProfiles();renderComments()}
  },function(){});
  S.db.collection("reactions").onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){var v=d.data().m;if(v&&typeof v==="object")m[d.id]=v});
    S.reactions=m;if(S.open)renderComments();
  },function(){});
  if(S.uid){
    S.db.doc("saves/"+S.uid).onSnapshot(function(s){
      var ids=s.exists&&Array.isArray(s.data().ids)?s.data().ids:[];
      S.saved=new Set(ids);renderTabs();renderGrid();if(S.open)renderTop();
    },function(){});
  }
}
init();
})();
</script>

</body></html>
